# The local Compose stack overlay, layered over docker-compose.yml by
# scripts/stack.sh, which writes .env.verify (this machine's generated secrets)
# on first use. Publishes web, API and Mailpit on 127.0.0.1 only, on the ports
# STACK_WEB_PORT, STACK_API_PORT and STACK_MAIL_PORT (3080, 4080 and 5085 by
# default), and keeps its data in the project's own named volumes.
services:
  caddy:
    ports: !override
      - '127.0.0.1:${STACK_WEB_PORT:-3080}:80'
    volumes: !override
      - ./infra/Caddyfile.local:/etc/caddy/Caddyfile:ro
  api:
    ports:
      - '127.0.0.1:${STACK_API_PORT:-4080}:4000'
    environment:
      TRUSTED_PROXIES: '0'
      API_PUBLIC_URL: http://localhost:${STACK_API_PORT:-4080}
      # A laptop's stack waits longer for the model than the production
      # default (20000), and serves one completion at a time.
      OPENAI_TIMEOUT_MS: '${OPENAI_TIMEOUT_MS:-60000}'
      AI_MAX_CONCURRENCY: '1'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: 'LearnSDLC <no-reply@learnsdlc.local>'
      MAIL_PREVIEW_URL: http://localhost:${STACK_MAIL_PORT:-5085}
  runner:
    mem_limit: 1536m
  web:
    mem_limit: 768m
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_MAX_MESSAGES: '100'
    ports:
      - '127.0.0.1:${STACK_MAIL_PORT:-5085}:8025'
